services:
  - type: web
    name: merch-shop
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && flask --app app initdb && python seed.py"
    startCommand: "gunicorn app:app"
    disk:
      name: shop-data
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.4