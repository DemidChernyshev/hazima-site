{% extends "base.html" %}
{% block content %}
<section class="hero">
    <div class="container">
        <h1>Стиль.<br><em>Орнамент.</em><br>Татарстан.</h1>
        <p>Ограниченные коллекции одежды, вдохновленные культурой нашего края. Плотный хлопок 240 г/м². Смысл в каждой детали.</p>
    </div>
</section>

<section class="catalog container">
    <div class="grid">
        {% for p in products %}
        <a href="{{ url_for('product', pid=p['id']) }}" class="card">
            <div class="card-img">
                <!-- Проверка: если файл картинки существует, показываем его. Если нет - просто темный фон -->
                <img src="{{ url_for('static', filename='img/tshirts/' ~ p['image']) }}" alt="{{ p['title'] }}" onerror="this.style.display='none'">
            </div>
            <div class="card-body">
                <div class="card-title">{{ p['title'] }}</div>
                <div class="card-price">{{ p['price'] }} ₽</div>
            </div>
        </a>
        {% endfor %}
    </div>
</section>
{% endblock %}
